    if not GITHUB_TOKEN:
        print("❌ Please set GITHUB_TOKEN environment variable")
        exit(1)
    
    # Initialize bot
    bot = GitHubActivityBot(
        github_token=GITHUB_TOKEN,
        kaggle_username=KAGGLE_USERNAME,
        kaggle_key=KAGGLE_KEY
    )
    
    # Run daily activity
