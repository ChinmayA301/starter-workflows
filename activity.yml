class GitHubActivityBot:
    """
    Advanced GitHub activity automation with arXiv, Kaggle, and project templates
    """
    
    def __init__(self, github_token, kaggle_username=None, kaggle_key=None,
                 topics=['machine-learning', 'deep-learning', 'generative-ai', 
                        'data-science', 'llm', 'transformers']):
        self.gh = Github(github_token)
        self.user = self.gh.get_user()
        self.topics = topics
        self.kaggle_username = kaggle_username
        self.kaggle_key = kaggle_key
        
    def find_trending_repos(self, min_stars=100, max_results=10):
        """Find trending repos in ML/AI space"""
        query_parts = [f"topic:{topic}" for topic in self.topics]
        query = " OR ".join(query_parts)
        query += f" stars:>{min_stars} pushed:>{datetime.now() - timedelta(days=30):%Y-%m-%d}"
        
        repos = self.gh.search_repositories(query=query, sort='stars', order='desc')
        
        results = []
        for repo in repos[:max_results]:
            results.append({
                'name': repo.full_name,
                'url': repo.html_url,
                'stars': repo.stargazers_count,
                'description': repo.description,
                'language': repo.language
            })
        return results
    
    def fetch_arxiv_papers(self, query='machine learning OR deep learning', max_results=5):
        """Fetch latest arXiv papers in ML/AI"""
        base_url = 'http://export.arxiv.org/api/query?'
        search_query = f"search_query=all:{query}&sortBy=submittedDate&sortOrder=descending&max_results={max_results}"
        
        try:
            response = requests.get(base_url + search_query)
            feed = feedparser.parse(response.content)
            
            papers = []
            for entry in feed.entries:
                papers.append({
                    'title': entry.title,
                    'authors': [author.name for author in entry.authors],
                    'summary': entry.summary,
                    'published': entry.published,
                    'link': entry.link,
                    'id': entry.id.split('/abs/')[-1]
                })
            return papers
        except Exception as e:
            print(f"Error fetching arXiv papers: {e}")
            return []
    
    def create_arxiv_reading_list(self, repo_name='arxiv-reading-list'):
        """Create/update arXiv paper reading list repo"""
        try:
            repo = self.user.get_repo(repo_name)
        except:
            repo = self.user.create_repo(
                name=repo_name,
                description="Curated list of ML/AI papers from arXiv with notes",
                auto_init=True
            )
            
        papers = self.fetch_arxiv_papers(max_results=5)
        
        today = datetime.now().strftime('%Y-%m-%d')
        year_month = datetime.now().strftime('%Y-%m')
        file_path = f"papers/{year_month}/{today}.md"
        
        content = f"""# arXiv Papers - {today}

## Papers of Interest

"""
        
        for i, paper in enumerate(papers, 1):
            authors_str = ", ".join(paper['authors'][:3])
            if len(paper['authors']) > 3:
                authors_str += " et al."
                
            content += f"""### {i}. {paper['title']}

**Authors:** {authors_str}  
**Published:** {paper['published'][:10]}  
**arXiv ID:** {paper['id']}  
**Link:** {paper['link']}

**Abstract (excerpt):**  
{paper['summary'][:300]}...

**My Notes:**
- Key contribution:
- Relevance to my work:
- Implementation ideas:

**Status:** 📚 To Read

---

"""
        
        content += f"""
## Reading Progress
- Total papers tracked: {len(papers)}
- Papers read this month: 0
- Implementation attempts: 0

## Tags
#machine-learning #deep-learning #research
"""
        
        try:
            repo.create_file(file_path, f"arXiv papers: {today}", content)
            print(f"✅ Created arXiv reading list for {today}")
            
            # Update main README
            self._update_arxiv_readme(repo, papers)
        except Exception as e:
            print(f"Error creating arXiv list: {e}")
    
    def _update_arxiv_readme(self, repo, latest_papers):
        """Update main README with latest papers"""
        readme_content = f"""# arXiv Reading List

Personal collection of ML/AI papers with implementation notes.

## Latest Papers ({datetime.now().strftime('%Y-%m-%d')})

"""
        for i, paper in enumerate(latest_papers[:3], 1):
            readme_content += f"{i}. [{paper['title']}]({paper['link']}) - {paper['published'][:10]}\n"
        
        readme_content += """

## Organization
- Papers organized by month in `/papers/YYYY-MM/` folders
- Each paper includes notes, implementation ideas, and reading status

## Legend
- 📚 To Read
- 📖 Reading
- ✅ Completed
- 💻 Implemented

"""
        
        try:
            readme = repo.get_contents("README.md")
            repo.update_file("README.md", "Update with latest papers", 
                           readme_content, readme.sha)
        except:
            repo.create_file("README.md", "Initial README", readme_content)
    
    def fetch_kaggle_datasets(self, search_term='machine learning'):
        """Fetch trending Kaggle datasets"""
        if not self.kaggle_username or not self.kaggle_key:
            print("Kaggle credentials not provided")
            return []
        
        try:
            # Note: Requires kaggle package and authentication
            from kaggle.api.kaggle_api_extended import KaggleApi
            api = KaggleApi()
            api.authenticate()
            
            datasets = api.dataset_list(search=search_term, sort_by='hottest', page=1)
            
            results = []
            for ds in datasets[:5]:
                results.append({
                    'ref': ds.ref,
                    'title': ds.title,
                    'size': ds.size,
                    'url': f"https://www.kaggle.com/datasets/{ds.ref}",
                    'votes': ds.voteCount
                })
            return results
        except Exception as e:
            print(f"Error fetching Kaggle datasets: {e}")
            return []
    
    def create_kaggle_project_template(self, dataset_name, project_type='analysis'):
        """Create project repo from Kaggle dataset with full template"""
        safe_name = dataset_name.lower().replace(' ', '-').replace('/', '-')
        repo_name = f"kaggle-{safe_name}"
        
        templates = {
            'analysis': {
                'description': f'Exploratory Data Analysis of {dataset_name}',
                'structure': {
                    'notebooks/01_data_exploration.ipynb': '# Data Exploration\n',
                    'notebooks/02_preprocessing.ipynb': '# Data Preprocessing\n',
                    'notebooks/03_visualization.ipynb': '# Data Visualization\n',
                    'notebooks/04_modeling.ipynb': '# Model Building\n',
                    'src/data_loader.py': self._get_data_loader_template(),
                    'src/preprocessing.py': self._get_preprocessing_template(),
                    'src/visualization.py': self._get_visualization_template(),
                    'src/utils.py': self._get_utils_template(),
                }
            },
            'competition': {
                'description': f'Kaggle Competition: {dataset_name}',
                'structure': {
                    'notebooks/baseline_model.ipynb': '# Baseline Model\n',
                    'src/models.py': self._get_models_template(),
                    'src/training.py': self._get_training_template(),
                    'src/evaluation.py': self._get_evaluation_template(),
                }
            }
        }
        
        template = templates.get(project_type, templates['analysis'])
        
        try:
            repo = self.user.create_repo(
                name=repo_name,
                description=template['description'],
                auto_init=True
            )
            
            # Create README
            readme = self._get_kaggle_readme_template(dataset_name)
            repo.create_file("README.md", "Initial README", readme)
            
            # Create requirements.txt
            requirements = """pandas>=2.0.0
numpy>=1.24.0
scikit-learn>=1.3.0
matplotlib>=3.7.0
seaborn>=0.12.0
jupyter>=1.0.0
plotly>=5.14.0
xgboost>=1.7.0
lightgbm>=3.3.0
optuna>=3.1.0
"""
            repo.create_file("requirements.txt", "Add requirements", requirements)
            
            # Create .gitignore
            gitignore = """*.pyc
__pycache__/
.ipynb_checkpoints/
.venv/
venv/
data/
*.csv
*.pkl
*.h5
*.pth
models/
logs/
.env
"""
            repo.create_file(".gitignore", "Add gitignore", gitignore)
            
            # Create directory structure
            for path, content in template['structure'].items():
                repo.create_file(path, f"Add {path}", content)
            
            print(f"✅ Created Kaggle project: {repo_name}")
            return repo
        except Exception as e:
            print(f"Error creating Kaggle project: {e}")
            return None
    
