    def create_ml_project_from_template(self, project_name, template_type='research'):
        """Create ML project with industry-standard structure"""
        templates = {
            'research': 'Research paper implementation',
            'deployment': 'Production ML pipeline',
            'experiment': 'ML experimentation framework',
            'tutorial': 'Educational ML tutorial'
        }
        
        description = templates.get(template_type, 'ML project')
        
        try:
            repo = self.user.create_repo(
                name=project_name,
                description=description,
                auto_init=True
            )
            
            # Create comprehensive structure
            structure = {
                'README.md': self._get_ml_project_readme(project_name, template_type),
                'requirements.txt': self._get_ml_requirements(),
                'setup.py': self._get_setup_py(project_name),
                '.gitignore': self._get_comprehensive_gitignore(),
                'Makefile': self._get_makefile(),
                'src/__init__.py': '',
                'src/data/__init__.py': '',
                'src/models/__init__.py': '',
                'src/features/__init__.py': '',
                'src/visualization/__init__.py': '',
                'tests/__init__.py': '',
                'tests/test_data.py': '# Add tests here\n',
                'notebooks/.gitkeep': '',
                'data/raw/.gitkeep': '',
                'data/processed/.gitkeep': '',
                'models/.gitkeep': '',
                'reports/.gitkeep': '',
                'configs/config.yaml': self._get_config_template(),
                'docker/Dockerfile': self._get_dockerfile(),
                '.github/workflows/tests.yml': self._get_ci_template(),
            }
            
            for path, content in structure.items():
                try:
                    repo.create_file(path, f"Add {path}", content)
                except:
                    pass  # Skip if file exists
            
            print(f"✅ Created ML project: {project_name}")
            return repo
        except Exception as e:
            print(f"Error creating ML project: {e}")
            return None
    
